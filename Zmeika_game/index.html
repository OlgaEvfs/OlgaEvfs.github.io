<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <link rel="stylesheet" href="MyStyles.css">
    <script src="myJS.js"></script>
</head>
<body>
    <div class="wrap">
        <div id="snake-field"></div>
        
        <div class="controls">
            <div class="control-row">
                <div id="btn-up" class="control-btn">▲</div>
            </div>
            <div class="control-row">
                <div id="btn-left" class="control-btn">◀</div>
                <div id="btn-down" class="control-btn">▼</div>
                <div id="btn-right" class="control-btn">▶</div>
            </div>
        </div>

        <div class="buttons">
            <div id="snake-start">Старт</div>
            <div id="snake-renew">Новая игра</div>
        </div>
    </div>

</html>
