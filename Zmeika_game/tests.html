<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тесты игры Змейка</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .test-item { margin-bottom: 10px; padding: 10px; border-radius: 5px; }
        .pass { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fail { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>Результаты тестирования</h1>
    <div id="test-results">Запуск тестов...</div>

    <!-- Подключаем основной код игры -->
    <script src="myJS.js"></script>

    <script>
        // Простая функция для вывода результатов
        function assert(condition, message) {
            const resultsDiv = document.getElementById('test-results');
            const div = document.createElement('div');
            div.className = 'test-item ' + (condition ? 'pass' : 'fail');
            div.textContent = (condition ? '✅ ' : '❌ ') + message;
            resultsDiv.appendChild(div);
        }

        // Очищаем сообщение о запуске
        document.getElementById('test-results').innerHTML = '';

        // --- ТЕСТЫ ---

        // 1. Тест границ поля
        (function testBoundaries() {
            assert(isOutside({x: -1, y: 10}) === true, "isOutside должен вернуть true для x = -1");
            assert(isOutside({x: 60, y: 10}) === true, "isOutside должен вернуть true для x = 60 (граница)");
            assert(isOutside({x: 30, y: 30}) === false, "isOutside должен вернуть false для центра поля");
        })();

        // 2. Тест столкновения со змейкой
        (function testSnakeCollision() {
            // Имитируем змейку
            snake = [{x: 10, y: 10}, {x: 11, y: 10}];
            assert(isSnakeUnit(10, 10) === true, "isSnakeUnit должен найти сегмент змейки");
            assert(isSnakeUnit(12, 10) === false, "isSnakeUnit не должен найти змейку там, где её нет");
        })();

        // 3. Тест изменения направления (логика клавиатуры)
        (function testDirectionChange() {
            direction = 'y+'; // Двигаемся вверх
            // Имитируем нажатие "Вниз" (keyCode 40)
            const eventDown = { keyCode: 40 };
            changeDirection(eventDown);
            assert(direction === 'y+', "Змейка не должна разворачиваться на 180 градусов (из вверх в вниз)");
            
            // Имитируем нажатие "Вправо" (keyCode 39)
            const eventRight = { keyCode: 39 };
            changeDirection(eventRight);
            assert(direction === 'x+', "Змейка должна успешно повернуть направо");
        })();

        // 4. Тест роста змейки при поедании еды
        (function testSnakeGrowth() {
            // Подготовка
            snake = [{x: 5, y: 5}];
            food = {x: 6, y: 5};
            direction = 'x+';
            const initialLength = snake.length;

            // Вызываем move вручную (один шаг)
            // Чтобы move не вызывал alert и render, мы их временно подменим
            const oldAlert = window.alert;
            const oldRender = window.render;
            window.alert = () => {};
            window.render = () => {};

            move();

            assert(snake.length === initialLength + 1, "Змейка должна вырасти после поедания еды");
            assert(snake[snake.length-1].x === 6, "Голова змейки должна оказаться на месте еды");

            // Возвращаем функции на место
            window.alert = oldAlert;
            window.render = oldRender;
        })();

    </script>
</body>
</html>
